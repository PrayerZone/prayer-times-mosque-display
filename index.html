<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071a18">
    <meta name="description" content="A modern mosque prayer-times display powered by PrayerZone.">
    <meta property="og:title" content="PrayerZone Mosque Display">
    <meta property="og:description" content="Prayer times, countdowns and announcements for mosque screens.">
    <meta property="og:url" content="https://prayerzone.github.io/prayer-times-mosque-display/">
    <meta property="og:image" content="https://raw.githubusercontent.com/PrayerZone/prayer-times-mosque-display/main/assets/social-preview.png">
    <title>PrayerZone Mosque Display</title>
    <link rel="canonical" href="https://prayerzone.github.io/prayer-times-mosque-display/">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://pray.zone">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="display-shell" id="app" aria-busy="true">
      <header class="topbar">
        <a class="brand" href="https://pray.zone/" target="_blank" rel="noopener">
          <span class="brand-mark" aria-hidden="true">◒</span>
          <span>PRAYERZONE</span>
        </a>
        <div class="topbar-actions">
          <span class="connection-status" id="connection-status" role="status">
            <span class="status-dot"></span>
            <span id="connection-label">Connecting</span>
          </span>
          <button class="icon-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen (F)">⛶</button>
          <button class="icon-button" id="settings-button" type="button" aria-label="Open settings" title="Settings (S)">⚙</button>
        </div>
      </header>

      <section class="hero" aria-labelledby="location-name">
        <div>
          <p class="eyebrow" id="location-kind">Prayer times</p>
          <h1 id="location-name">Loading…</h1>
          <p class="location-meta" id="location-meta"></p>
        </div>
        <div class="clock-panel">
          <time class="clock" id="clock">--:--</time>
          <p class="date" id="date">—</p>
        </div>
      </section>

      <section class="next-prayer" aria-labelledby="next-prayer-name">
        <div class="next-prayer-copy">
          <p class="eyebrow">Next prayer</p>
          <h2 id="next-prayer-name">—</h2>
          <p id="next-prayer-time">—</p>
        </div>
        <div class="countdown" aria-live="polite">
          <span id="countdown-value">--:--:--</span>
          <small>remaining</small>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="prayer-progress"></span>
        </div>
      </section>

      <section class="prayer-section" aria-labelledby="schedule-heading">
        <div class="section-heading">
          <h2 id="schedule-heading">Today’s schedule</h2>
          <p id="calculation-summary"></p>
        </div>
        <div class="prayer-grid" id="prayer-grid"></div>
      </section>

      <aside class="announcement" id="announcement" hidden>
        <span class="announcement-icon" aria-hidden="true">✦</span>
        <p id="announcement-text"></p>
      </aside>

      <footer>
        <p>Prayer times powered by <a href="https://pray.zone/" target="_blank" rel="noopener">pray.zone</a></p>
        <p id="last-updated"></p>
      </footer>
    </main>

    <div class="error-banner" id="error-banner" role="alert" hidden>
      <strong>Unable to update prayer times.</strong>
      <span id="error-message"></span>
      <button id="retry-button" type="button">Retry</button>
    </div>

    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Display setup</p>
            <h2>Settings</h2>
          </div>
          <button class="icon-button close-button" value="cancel" aria-label="Close settings">×</button>
        </div>

        <div class="form-grid">
          <label>
            Schedule source
            <select name="sourceType" id="source-type">
              <option value="city">City</option>
              <option value="mosque">Mosque</option>
            </select>
          </label>
          <label>
            <span id="source-label">City slug</span>
            <input name="sourceId" id="source-id" value="paris" required autocomplete="off">
            <small id="source-help">Example: paris</small>
          </label>
          <label>
            Language
            <select name="language">
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="ar">العربية</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
              <option value="bn">বাংলা</option>
              <option value="it">Italiano</option>
              <option value="pt">Português</option>
            </select>
          </label>
          <label>
            Theme
            <select name="theme">
              <option value="emerald">Emerald</option>
              <option value="midnight">Midnight</option>
              <option value="sand">Sand</option>
              <option value="auto">Automatic</option>
            </select>
          </label>
          <label class="wide">
            Mosque display name <span class="optional">(optional)</span>
            <input name="displayName" placeholder="Al Noor Community Mosque" maxlength="80">
          </label>
          <label class="wide">
            Announcements <span class="optional">(one per line)</span>
            <textarea name="announcements" rows="4" placeholder="Friday prayer starts at 13:30&#10;Community dinner after Maghrib"></textarea>
          </label>
          <label>
            Rotate announcements every
            <select name="announcementInterval">
              <option value="10">10 seconds</option>
              <option value="20">20 seconds</option>
              <option value="30">30 seconds</option>
              <option value="60">1 minute</option>
            </select>
          </label>
          <label class="check-label">
            <input type="checkbox" name="showSeconds">
            Show seconds
          </label>
        </div>

        <div class="dialog-actions">
          <button class="secondary-button" id="reset-button" type="button">Reset</button>
          <button class="primary-button" value="save" type="submit">Save and refresh</button>
        </div>
        <p class="settings-note">Settings stay on this device. Add <code>?city=paris&amp;lang=en</code> to the URL for managed displays.</p>
      </form>
    </dialog>

    <noscript>This display requires JavaScript to retrieve and update prayer times.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
